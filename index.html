<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini E-Ticaret</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<h2 class="total-area">
  Toplam Tutar: <span id="toplam">0</span>
</h2>

<div class="products">

  <div class="card">
    <img src="headphone.jpg">
    <h2>Kulaklık</h2>
    <p>1000₺</p>
    <p>Ürün Adeti: <span class="count">0</span></p>
    <button class="btn">Sepete Ekle</button>
    <div class="action">
      <button class="artı">+</button>
      <button class="eksi">-</button>
      <button class="sil">sil</button>
    </div>
  </div>

  <div class="card">
    <img src="phone.jpg">
    <h2>Cep Telefonu</h2>
    <p>15000₺</p>
    <p>Ürün Adeti: <span class="count">0</span></p>
    <button class="btn">Sepete Ekle</button>
    <div class="action">
      <button class="artı">+</button>
      <button class="eksi">-</button>
      <button class="sil">sil</button>
    </div>
  </div>

  <div class="card">
    <img src="watch.jpg">
    <h2>Kol Saati</h2>
    <p>5000₺</p>
    <p>Ürün Adeti: <span class="count">0</span></p>
    <button class="btn">Sepete Ekle</button>
    <div class="action">
      <button class="artı">+</button>
      <button class="eksi">-</button>
      <button class="sil">sil</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
