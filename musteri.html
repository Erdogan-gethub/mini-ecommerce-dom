<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kuaför Randevu</title>

<link rel="stylesheet" href="musteri.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>

<body>

<div class="container">

<!-- SOL PANEL -->
<div class="form-alan">

<div class="logo">
<img src="kuafor.png" alt="Kuaför Logo">
</div>

<h1>Kuaför Randevu</h1>

<p class="calisma-saat">
Çalışma Saatleri: 09:00 - 18:00
</p>

<form id="randevuForm" novalidate>

<input type="text" id="adsoyad" placeholder="Ad Soyad" autocomplete="off" required>

<input type="tel" id="telefon" placeholder="Telefon (05xx xxx xx xx)" autocomplete="off" required>

<label for="tarih">Randevu Tarihi</label>
<input type="text" id="tarih" placeholder="Randevu Tarihi" required>

<!-- KUAFÖR -->
<label for="kuafor">Kuaför Seçiniz</label>
<select id="kuafor" required>
<option value="">Kuaför Seçiniz</option>
<option value="1">👤 Kuaför 1</option>
<option value="2">👤 Kuaför 2</option>
<option value="3">👤 Kuaför 3</option>
<option value="4">👤 Kuaför 4</option>
</select>

<!-- HİZMET -->
<label for="hizmet">Hizmet Seçiniz</label>
<select id="hizmet" required>
<option value="15">Sakal Traşı (15 dk)</option>
<option value="30">Saç Traşı (30 dk)</option>
<option value="45">Saç + Sakal (45 dk)</option>
<option value="60">Saç + Sakal + Bakım (60 dk)</option>
</select>

<!-- SAAT -->
<label for="saat">Saat Seçiniz</label>
<select id="saat" required>
<option value="">Önce tarih ve kuaför seç</option>
</select>

<button type="submit" id="randevuBtn" disabled>Randevu Al</button>

</form>

</div>

<!-- SAĞ PANEL -->
<div class="randevu-alan">

<h2>Randevular</h2>
<div id="randevuListesi"></div>

</div>

</div>

<!-- TOAST -->
<div id="toast"></div>

<!-- JS -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/tr.js"></script>
<script src="musteri.js"></script>

</body>
</html>
