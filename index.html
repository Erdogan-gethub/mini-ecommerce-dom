<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Müşteri Paneli</title>

<link rel="stylesheet" href="musteri.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>

<body>

<div class="container">

<div class="form-alan">
<div class="logo">
<img src="kuafor.png" alt="Kuaför Logo">
</div>
<h1>Kuafor Randevu</h1>

<p class="calisma-saat">
Çalışma Saatleri: 09:00 - 18:00
</p>

<form id="randevuForm">

<input type="text" id="adsoyad" placeholder="Ad Soyad" required>

<input type="tel" id="telefon" placeholder="Telefon (05xx xxx xx xx)" required>

<label>Randevu Tarihi</label>

<input type="text" id="tarih" placeholder="Randevu Tarihi" required>

<label>Hizmet Seçiniz</label>

<select id="hizmet">

<option value="15">Sakal Traşı (15 dk)</option>
<option value="30">Saç Traşı (30 dk)</option>
<option value="45">Saç + Sakal (45 dk)</option>
<option value="60">Saç + Sakal + Bakım (60 dk)</option>

</select>

<label>Saat Seçiniz</label>

<select id="saat" required>

<option value="">Saat Seçiniz</option>

<option>09:00</option>
<option>09:15</option>
<option>09:30</option>
<option>09:45</option>

<option>10:00</option>
<option>10:15</option>
<option>10:30</option>
<option>10:45</option>

<option>11:00</option>
<option>11:15</option>
<option>11:30</option>
<option>11:45</option>

<option>12:00</option>
<option>12:15</option>
<option>12:30</option>
<option>12:45</option>

<option>13:00</option>
<option>13:15</option>
<option>13:30</option>
<option>13:45</option>

<option>14:00</option>
<option>14:15</option>
<option>14:30</option>
<option>14:45</option>

<option>15:00</option>
<option>15:15</option>
<option>15:30</option>
<option>15:45</option>

<option>16:00</option>
<option>16:15</option>
<option>16:30</option>
<option>16:45</option>

<option>17:00</option>
<option>17:15</option>
<option>17:30</option>
<option>17:45</option>

</select>

<button type="submit">Randevu Al</button>

</form>

</div>

<div class="randevu-alan">

<h2>Randevular</h2>

<div id="randevuListesi"></div>

</div>

</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/tr.js"></script>

<script src="musteri.js"></script>

</body>
</html>
