<!DOCTYPE html>
<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Müşteri Paneli</title>

<link rel="stylesheet" href="musteri.css">

<!-- Flatpickr CSS -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

</head>

<body>

<div class="container">

<div class="form-alan">

<h1>Kuaför Randevu</h1>

<form id="randevuForm">

<input type="text" id="adsoyad" placeholder="Ad Soyad" required>

<input type="tel" id="telefon" placeholder="Telefon (05xx xxx xx xx)" required>

<label>Randevu Tarihi</label>

<input type="text" id="tarih" placeholder="Randevu Tarihi" required>

<select id="saat" required>

<option value="">Saat Seçiniz</option>
<option value="09:00">09:00</option>
<option value="09:30">09:30</option>
<option value="10:00">10:00</option>
<option value="10:30">10:30</option>
<option value="11:00">11:00</option>
<option value="11:30">11:30</option>
<option value="12:00">12:00</option>
<option value="13:00">13:00</option>
<option value="13:30">13:30</option>
<option value="14:00">14:00</option>
<option value="14:30">14:30</option>
<option value="15:00">15:00</option>
<option value="15:30">15:30</option>
<option value="16:00">16:00</option>
<option value="16:30">16:30</option>
<option value="17:00">17:00</option>
<option value="17:30">17:30</option>

</select>

<button type="submit">Randevu Al</button>

</form>

</div>

<div class="randevu-alan">

<h2>Randevular</h2>

<div id="randevuListesi"></div>

</div>

</div>

<div id="toast"></div>

<script src="musteri.js"></script>

<!-- Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<!-- Türkçe Dil -->
<script src="https://npmcdn.com/flatpickr/dist/l10n/tr.js"></script>

<script>

flatpickr("#tarih", {

locale: "tr",
dateFormat: "d.m.Y"

});

</script>

</body>
</html>
